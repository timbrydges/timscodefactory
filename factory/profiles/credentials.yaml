schema_version: "1.0"
default: deny
profiles:
  controller_service:
    identity_type: workload_oidc
    repository_access: read
    github_actions: write
    state_store_access: conditional_write
    secrets: [provider_broker_token]
  owner_human:
    identity_type: verified_human
    repository_access: admin
    ruleset_bypass: always
    state_store_access: emergency_read_write
    production_approval: not_required_for_owner
  gh_feature_writer:
    identity_type: github_app_installation
    repository_access: scoped_write
    paths: ["src/**", "tests/unit/**", "docs/implementation/**"]
    state_store_access: none
  gh_docs_writer:
    identity_type: github_app_installation
    repository_access: scoped_write
    paths: ["specs/**"]
    state_store_access: none
  gh_architecture_writer:
    identity_type: github_app_installation
    repository_access: scoped_write
    paths: ["architecture/**", "docs/adr/**"]
    state_store_access: none
  gh_qa_writer:
    identity_type: github_app_installation
    repository_access: scoped_write
    paths: ["tests/**", "qa/**"]
    state_store_access: none
  gh_readonly_reviewer:
    identity_type: github_app_installation
    repository_access: read
    pull_request_review: write
    state_store_access: none
  release_oidc_workflow:
    identity_type: github_actions_oidc
    repository_access: read
    state_store_access: release_records_and_task_authorization
    cloud_subject: "repo:timbrydges@214414801/timscodefactory@1345656137:environment:production"
    long_lived_cloud_secret: prohibited
