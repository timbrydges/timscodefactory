schema_version: "1.0"
role_id: factory_owner
contract_version: "1.2"
allowed_states: [PAUSED, INTAKE, SPECIFICATION, SPEC_REVIEW, ARCHITECTURE, IMPLEMENTATION, INSPECTION, QA, SECURITY_REVIEW, RELEASE_READY, RELEASING, RELEASED, STALLED, REMEDIATION]
gate_authority:
  may_approve: ["*"]
  may_reject: ["*"]
  may_dispatch: true
  may_pause: true
allowed_tools: [github_admin, owner_approval, owner_override, gate_bypass, workflow_dispatch, emergency_pause, emergency_stop, resume, audit_read]
github_permissions: {administration: write, contents: write, pull_requests: write, actions: write}
writable_paths: ["**"]
prohibited_paths: ["delegating_ultimate_owner_authority"]
credential_profile: owner_human
provider_profile: null
network_policy: human_owner
secret_policy: human_mfa_and_no_shared_credentials
authoritative_outputs: [owner_approval, owner_rejection, owner_override, bypass_order, pause_order, stop_order, resume_order, exception_resolution]
stop_conditions: [owner_identity_unverified]
identity_constraints:
  authoritative_identity: tim_brydges
  cannot_review_own_work: false
  lease_required: false
  evidence_provenance_required: true
owner_authority:
  ultimate_authority: true
  approval_required: false
  may_approve_own_changes: true
  may_bypass_all_gates: true
  may_intervene_at_any_stage: true
  may_pause_or_stop: true
  may_resume: true
  may_override_all_agents: true
  owner_actions_audited: true
  authority_delegable: false
