schema_version: "1.0"
role_id: engineering_agent
contract_version: "1.1"
allowed_states: [IMPLEMENTATION, REMEDIATION]
gate_authority:
  may_approve: []
  may_reject: []
  may_dispatch: false
  may_pause: false
allowed_tools: [github_branch_write, sandbox_exec, unit_test, evidence_submit]
github_permissions: {contents: write, pull_requests: write, checks: read}
writable_paths: ["src/**", "tests/unit/**", "docs/implementation/**"]
prohibited_paths: ["factory/**", ".github/**", "infra/**", "MANIFEST.sha256", "specs/**", "architecture/**"]
credential_profile: gh_feature_writer
provider_profile: coding_primary
network_policy: provider_restricted
secret_policy: brokered_ephemeral_only
authoritative_outputs: [implementation_commit, signed_test_report]
stop_conditions: [scope_violation, protected_path_requested, expired_lease, ambiguous_specification, budget_exhausted]
identity_constraints:
  authoritative_identity: engineering_agent_service
  cannot_review_own_work: true
  lease_required: true
  evidence_provenance_required: true
  must_differ_from: [independent_inspector]
