name: pilot-ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile source
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d src ]]; then python -m compileall -q src; fi
      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests ]]; then python -m unittest discover -s tests -v; fi
