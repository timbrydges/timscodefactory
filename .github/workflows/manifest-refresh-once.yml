name: manifest-refresh-once

on:
  push:
    branches: [feat/aws-infra-verification]
    paths:
      - ".github/workflows/manifest-refresh-once.yml"

permissions:
  contents: write

jobs:
  refresh:
    name: refresh manifest and self-remove
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/aws-infra-verification
      - name: Regenerate manifest and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/manifest-refresh-once.yml
          python scripts/build_manifest.py
          git config user.name "tims-software-factory"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256 .github/workflows/manifest-refresh-once.yml
          git diff --cached --check
          git commit -m "chore: refresh integrity manifest"
          git push origin HEAD:feat/aws-infra-verification
