name: prepare-openai-provider

on:
  push:
    branches:
      - feat/disabled-openai-provider-invoker

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'timbrydges/timscodefactory' && github.actor == 'timbrydges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/disabled-openai-provider-invoker
          fetch-depth: 1
      - name: Finalize OpenAI provider exports and tests
        shell: python
        run: |
          from pathlib import Path

          test = Path('tests/test_openai_provider.py')
          text = test.read_text(encoding='utf-8')
          text = text.replace(
              '    OpenAIProviderDisabledError,\n',
              '    OpenAIProviderCredentialError,\n    OpenAIProviderDisabledError,\n',
          )
          text = text.replace(
              '        with self.assertRaises(Exception):\n',
              '        with self.assertRaises(OpenAIProviderCredentialError):\n',
              1,
          )
          test.write_text(text, encoding='utf-8')

          init = Path('src/factory_runtime/__init__.py')
          text = init.read_text(encoding='utf-8')
          marker = 'from .pipeline import (\n'
          block = '''from .openai_provider import (\n    OpenAIProviderCredentialError,\n    OpenAIProviderDisabledError,\n    OpenAIProviderError,\n    OpenAIProviderPolicy,\n    OpenAIProviderPricingError,\n    OpenAIProviderProtocolError,\n    OpenAIResponsesProviderInvoker,\n    ProviderCredentialLease,\n    ProviderCredentialSource,\n    ProviderHTTPResponse,\n    ProviderHTTPTransport,\n    ProviderPricingQuote,\n    ProviderPricingSource,\n)\n'''
          if block not in text:
              if text.count(marker) != 1:
                  raise SystemExit('pipeline import marker not unique')
              text = text.replace(marker, block + marker, 1)

          additions = [
              '    "OpenAIProviderCredentialError",\n',
              '    "OpenAIProviderDisabledError",\n',
              '    "OpenAIProviderError",\n',
              '    "OpenAIProviderPolicy",\n',
              '    "OpenAIProviderPricingError",\n',
              '    "OpenAIProviderProtocolError",\n',
              '    "OpenAIResponsesProviderInvoker",\n',
              '    "ProviderCredentialLease",\n',
              '    "ProviderCredentialSource",\n',
              '    "ProviderHTTPResponse",\n',
              '    "ProviderHTTPTransport",\n',
              '    "ProviderPricingQuote",\n',
              '    "ProviderPricingSource",\n',
          ]
          anchor = '    "ProviderBrokerAuthenticationError",\n'
          if text.count(anchor) != 1:
              raise SystemExit('__all__ anchor not unique')
          missing = ''.join(item for item in additions if item not in text)
          if missing:
              text = text.replace(anchor, missing + anchor, 1)
          init.write_text(text, encoding='utf-8')
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v
      - name: Generate exact manifest and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-openai-provider.yml
          python3 scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: refresh OpenAI-provider manifest [skip ci]"
          git push origin HEAD:feat/disabled-openai-provider-invoker
