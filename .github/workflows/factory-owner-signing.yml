name: factory-owner-signing

on:
  workflow_dispatch:
    inputs:
      inspector_recovery001_plan_digest:
        description: "Exact owner-approved recovery plan digest; signing only"
        required: false
        type: string
        default: ""
      pilot002_reviewer_role:
        description: "Reviewer to sign; requires a separately approved committed plan"
        required: false
        type: choice
        options: [none, inspector, qa]
        default: none
      pilot002_reviewer_plan_digest:
        description: "Exact owner-approved reviewer plan digest; signing only"
        required: false
        type: string
        default: ""
      pilot002_builder_plan_digest:
        description: 'Exact reviewed Pilot 002 Builder plan digest; signing only, no invocation'
        required: false
        type: string
        default: ''
      receipt_iam_canary:
        description: 'Publish one inert owner IAM canary; no approval receipt'
        required: false
        type: boolean
        default: false
      owner_plan_base64:
        description: 'Exact bounded acceptance plan; used only when owner publication is enabled'
        required: false
        type: string
        default: ''
      approved_plan_digest:
        description: 'Owner-approved sha256 plan digest; no reviewer or execution authority'
        required: false
        type: string
        default: ''

      google_proposal_base64:
        description: 'Exact owner-approved zero-dollar Google proposal; no invocation'
        required: false
        type: string
        default: ''
      google_approved_digest:
        description: 'Digest of the human-approved zero-dollar proposal'
        required: false
        type: string
        default: ''
      google_target_source:
        description: 'Exact verified deployed Google broker source commit'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-owner-signing
  cancel-in-progress: false

jobs:
  sign_inspector_recovery001_allowance:
    if: >-
      inputs.inspector_recovery001_plan_digest != '' &&
      (inputs.pilot002_reviewer_role == '' || inputs.pilot002_reviewer_role == 'none') &&
      inputs.pilot002_reviewer_plan_digest == '' && inputs.pilot002_builder_plan_digest == '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      github.run_attempt == 1 && inputs.google_proposal_base64 == '' &&
      inputs.google_approved_digest == '' && inputs.google_target_source == '' &&
      inputs.owner_plan_base64 == '' && inputs.approved_plan_digest == '' &&
      inputs.receipt_iam_canary == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
      RECOVERY001_PLAN_DIGEST: ${{ inputs.inspector_recovery001_plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-role-lambda.txt -r requirements-aws-signing.txt
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: recovery001-owner-${{ github.run_id }}
      - name: Sign exact reviewed recovery allowance once
        run: python scripts/sign_inspector_recovery001_allowance.py "$RUNNER_TEMP/recovery001-allowance.json" --approved-plan-digest "$RECOVERY001_PLAN_DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: recovery001-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/recovery001-allowance.json
          if-no-files-found: ignore
          retention-days: 1
  sign_pilot002_reviewer_allowance:
    if: >-
      inputs.inspector_recovery001_plan_digest == '' &&
      (inputs.pilot002_reviewer_role == 'inspector' || inputs.pilot002_reviewer_role == 'qa') &&
      inputs.pilot002_reviewer_plan_digest != '' && inputs.pilot002_builder_plan_digest == '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      github.run_attempt == 1 && inputs.google_proposal_base64 == '' &&
      inputs.google_approved_digest == '' && inputs.google_target_source == '' &&
      inputs.owner_plan_base64 == '' && inputs.approved_plan_digest == '' &&
      inputs.receipt_iam_canary == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
      PILOT002_PLAN_DIGEST: ${{ inputs.pilot002_reviewer_plan_digest }}
      PILOT002_REVIEWER_ROLE: ${{ inputs.pilot002_reviewer_role }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-role-lambda.txt -r requirements-aws-signing.txt
      - run: python -c "import boto3; from botocore.session import get_session; assert 'ED25519_SHA_512' in get_session().get_service_model('kms').shape_for('SigningAlgorithmSpec').enum"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: pilot002-reviewer-owner-${{ github.run_id }}
      - name: Sign exact reviewed reviewer allowance once
        run: python scripts/sign_pilot002_reviewer_allowance.py "$PILOT002_REVIEWER_ROLE" "$RUNNER_TEMP/pilot002-reviewer-allowance.json" --approved-plan-digest "$PILOT002_PLAN_DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pilot002-reviewer-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot002-reviewer-allowance.json
          if-no-files-found: ignore
          retention-days: 1
  sign_pilot002_builder_allowance:
    if: >-
      inputs.inspector_recovery001_plan_digest == '' &&
      (inputs.pilot002_reviewer_role == '' || inputs.pilot002_reviewer_role == 'none') &&
      inputs.pilot002_reviewer_plan_digest == '' &&
      inputs.pilot002_builder_plan_digest != '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      github.run_attempt == 1 && inputs.google_proposal_base64 == '' &&
      inputs.google_approved_digest == '' && inputs.google_target_source == '' &&
      inputs.owner_plan_base64 == '' && inputs.approved_plan_digest == '' &&
      inputs.receipt_iam_canary == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
      PILOT002_PLAN_DIGEST: ${{ inputs.pilot002_builder_plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-role-lambda.txt -r requirements-aws-signing.txt
      - run: python -c "import boto3; from botocore.session import get_session; assert 'ED25519_SHA_512' in get_session().get_service_model('kms').shape_for('SigningAlgorithmSpec').enum"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: pilot002-builder-owner-${{ github.run_id }}
      - name: Sign exact reviewed Builder allowance once
        run: python scripts/sign_pilot002_builder_allowance.py "$RUNNER_TEMP/pilot002-builder-allowance.json" --approved-plan-digest "$PILOT002_PLAN_DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: pilot002-builder-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/pilot002-builder-allowance.json
          if-no-files-found: ignore
          retention-days: 1
  sign_google_free_allowance:
    if: >-
      inputs.inspector_recovery001_plan_digest == '' &&
      (inputs.pilot002_reviewer_role == '' || inputs.pilot002_reviewer_role == 'none') &&
      inputs.pilot002_reviewer_plan_digest == '' &&
      inputs.pilot002_builder_plan_digest == '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      github.run_attempt == 1 && vars.FACTORY_GOOGLE_FREE_SIGNING_ENABLED == 'true' &&
      inputs.google_proposal_base64 != '' && inputs.google_approved_digest != '' &&
      inputs.google_target_source != '' && inputs.owner_plan_base64 == '' &&
      inputs.receipt_iam_canary == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
      GOOGLE_PROPOSAL_BASE64: ${{ inputs.google_proposal_base64 }}
      GOOGLE_APPROVED_DIGEST: ${{ inputs.google_approved_digest }}
      GOOGLE_TARGET_SOURCE: ${{ inputs.google_target_source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-role-lambda.txt -r requirements-aws-signing.txt
      - run: python -c "import boto3; from botocore.session import get_session; assert 'ED25519_SHA_512' in get_session().get_service_model('kms').shape_for('SigningAlgorithmSpec').enum"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: google-free-owner-${{ github.run_id }}
      - name: Sign exact zero-dollar proposal once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os, pathlib
          raw=base64.b64decode(os.environ['GOOGLE_PROPOSAL_BASE64'],validate=True)
          if len(raw)>4096: raise RuntimeError('proposal exceeds signing bound')
          with (pathlib.Path(os.environ['RUNNER_TEMP'])/'google-proposal.json').open('xb') as output:
              output.write(raw)
          PY
          python scripts/sign_google_qa_free_allowance.py "$RUNNER_TEMP/google-proposal.json" "$RUNNER_TEMP/google-allowance.json" --approved-digest "$GOOGLE_APPROVED_DIGEST" --target-source-commit "$GOOGLE_TARGET_SOURCE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: google-free-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/google-allowance.json
          if-no-files-found: ignore
          retention-days: 1
  publish_owner_receipt:
    if: >-
      inputs.inspector_recovery001_plan_digest == '' &&
      (inputs.pilot002_reviewer_role == '' || inputs.pilot002_reviewer_role == 'none') &&
      inputs.pilot002_reviewer_plan_digest == '' &&
      inputs.pilot002_builder_plan_digest == '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      github.run_attempt == 1 && vars.FACTORY_OWNER_RECEIPT_PUBLICATION_ENABLED == 'true' &&
      inputs.owner_plan_base64 != '' && inputs.approved_plan_digest != '' &&
      inputs.receipt_iam_canary == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
      FACTORY_OWNER_PUBLICATION_ENABLED: ${{ vars.FACTORY_OWNER_RECEIPT_PUBLICATION_ENABLED }}
      FACTORY_OWNER_PLAN_BASE64: ${{ inputs.owner_plan_base64 }}
      FACTORY_OWNER_APPROVED_PLAN_DIGEST: ${{ inputs.approved_plan_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-role-lambda.txt
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: owner-receipt-${{ github.run_id }}
      - name: Publish exact owner receipt once
        run: python scripts/publish_acceptance_owner_receipt.py "$RUNNER_TEMP/owner-receipt-result.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: owner-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/owner-receipt-result.json
          if-no-files-found: ignore
          retention-days: 30
  receipt_iam_canary:
    if: >-
      inputs.inspector_recovery001_plan_digest == '' &&
      (inputs.pilot002_reviewer_role == '' || inputs.pilot002_reviewer_role == 'none') &&
      inputs.pilot002_reviewer_plan_digest == '' &&
      inputs.pilot002_builder_plan_digest == '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      inputs.receipt_iam_canary == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: signing-owner-${{ github.run_id }}
      - name: Prove owner receipt IAM with inert versioned object
        shell: bash
        run: |
          set -euo pipefail
          python scripts/receipt_writer_live_canary.py owner "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$GITHUB_SHA"
  verify:
    if: >-
      inputs.inspector_recovery001_plan_digest == '' &&
      (inputs.pilot002_reviewer_role == '' || inputs.pilot002_reviewer_role == 'none') &&
      inputs.pilot002_reviewer_plan_digest == '' &&
      inputs.pilot002_builder_plan_digest == '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      vars.FACTORY_SIGNING_CANARY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: signing-owner-${{ github.run_id }}
      - name: Prove signing identity and cross-role denial
        shell: bash
        run: |
          set -euo pipefail
          python scripts/kms_signing_canary.py owner "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$GITHUB_SHA" > "$RUNNER_TEMP/signing-evidence.json"
          cat "$RUNNER_TEMP/signing-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-signing-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/signing-evidence.json
          if-no-files-found: error
          retention-days: 30
