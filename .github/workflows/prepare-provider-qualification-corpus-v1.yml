name: prepare-provider-qualification-corpus-v1

on:
  push:
    branches:
      - feat/provider-qualification-corpus-v1

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'timbrydges/timscodefactory' && github.actor == 'timbrydges'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-qualification-corpus-v1
          fetch-depth: 1
      - name: Bind corpus cases to evaluator oracles
        shell: python
        run: |
          from pathlib import Path

          runner = Path('src/factory_runtime/provider_qualification_runner.py')
          text = runner.read_text(encoding='utf-8')
          old = '''    expected_outcome: str\n    fixture_ref: str\n    original_command: tuple[str, ...]\n'''
          new = '''    expected_outcome: str\n    fixture_ref: str\n    oracle_ref: str\n    original_command: tuple[str, ...]\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('qualification case dataclass patch target missing')
              text = text.replace(old, new, 1)
          old = '''                expected_outcome=item["expected_outcome"],\n                fixture_ref=item["fixture_ref"],\n                original_command=tuple(item["original_command"]),\n'''
          new = '''                expected_outcome=item["expected_outcome"],\n                fixture_ref=item["fixture_ref"],\n                oracle_ref=item["oracle_ref"],\n                original_command=tuple(item["original_command"]),\n'''
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('qualification case loader patch target missing')
              text = text.replace(old, new, 1)
          runner.write_text(text, encoding='utf-8')

          tests = Path('tests/test_provider_qualification_runner.py')
          text = tests.read_text(encoding='utf-8')
          replacements = {
              '"fixture_ref": "fixtures/repair-001",': '"fixture_ref": "fixtures/repair-001",\n                "oracle_ref": "oracles/repair-001.json",',
              '"fixture_ref": "fixtures/escalate-001",': '"fixture_ref": "fixtures/escalate-001",\n                "oracle_ref": "oracles/escalate-001.json",',
              '"fixture_ref": "fixtures/safety-001",': '"fixture_ref": "fixtures/safety-001",\n                "oracle_ref": "oracles/safety-001.json",',
          }
          for old, new in replacements.items():
              if new not in text:
                  if text.count(old) != 1:
                      raise SystemExit(f'runner test oracle patch target missing: {old}')
                  text = text.replace(old, new, 1)
          tests.write_text(text, encoding='utf-8')
      - name: Generate locked corpus fixtures, oracles and hidden tests
        run: python scripts/build_provider_qualification_corpus.py --root .
      - name: Prove corpus generator is deterministic
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import subprocess

          root = Path('.')
          watched = [
              root / 'factory/evals/provider-repair-corpus-v1.json',
              root / 'factory/evals/fixtures/provider-repair-v1',
              root / 'factory/evals/oracles/provider-repair-v1',
              root / 'factory/evals/hidden-tests/provider-repair-v1',
          ]
          def digest():
              h = hashlib.sha256()
              files = []
              for item in watched:
                  if item.is_file():
                      files.append(item)
                  else:
                      files.extend(path for path in item.rglob('*') if path.is_file())
              for path in sorted(files, key=lambda p: p.as_posix()):
                  rel = path.relative_to(root).as_posix().encode()
                  h.update(len(rel).to_bytes(4, 'big'))
                  h.update(rel)
                  data = path.read_bytes()
                  h.update(len(data).to_bytes(8, 'big'))
                  h.update(data)
              return h.hexdigest()
          before = digest()
          subprocess.run(
              ['python', 'scripts/build_provider_qualification_corpus.py', '--root', '.'],
              check=True,
          )
          after = digest()
          if before != after:
              raise SystemExit('provider qualification corpus generator is not deterministic')
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run full unit and corpus-integrity suite before PR
        run: python -m unittest discover -s tests -v
      - name: Generate exact manifest and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-provider-qualification-corpus-v1.yml
          python3 scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: lock provider-repair corpus v1 [skip ci]"
          git push origin HEAD:feat/provider-qualification-corpus-v1
