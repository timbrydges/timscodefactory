name: prepare-sqlite-trace-store

on:
  push:
    branches: [feat/sqlite-trace-fingerprint-store]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Bind fingerprint index to trace and export API
        run: |
          python - <<'PY'
          from pathlib import Path

          trace = Path('src/factory_runtime/brokered_repair_trace.py')
          text = trace.read_text()
          old = '    recorder.emit(RuntimeTraceEventType.SESSION_STARTED, {"component": _TRACE_COMPONENT})\n'
          new = '''    recorder.emit(\n        RuntimeTraceEventType.SESSION_STARTED,\n        {\n            "component": _TRACE_COMPONENT,\n            "failure_fingerprint_digest": fingerprint.digest,\n            "failure_fingerprint_version": fingerprint.version,\n            "failure_command_digest": fingerprint.command_digest,\n        },\n    )\n'''
          if old not in text:
              raise SystemExit('session start marker not found')
          trace.write_text(text.replace(old, new))

          store = Path('src/factory_runtime/trace_store_sqlite.py')
          value = store.read_text()
          marker = '''        fingerprint = artifact.failure_fingerprint\n        for value in (\n'''
          insert = '''        fingerprint = artifact.failure_fingerprint\n        first_attributes = artifact.events[0].attributes\n        if (\n            first_attributes.get("failure_fingerprint_digest") != fingerprint.digest\n            or first_attributes.get("failure_fingerprint_version") != fingerprint.version\n            or first_attributes.get("failure_command_digest") != fingerprint.command_digest\n        ):\n            raise SQLiteTraceStoreError("trace-bound fingerprint metadata disagrees with artifact")\n        for value in (\n'''
          if marker not in value:
              raise SystemExit('artifact validation marker not found')
          value = value.replace(marker, insert)
          old_summary = '''    def summarize_fingerprint(self, fingerprint_digest: str) -> FailureFingerprintHistory | None:\n        artifacts = self.find_by_fingerprint(fingerprint_digest, limit=100)\n        if not artifacts:\n            return None\n        successful = [item for item in artifacts if item.replay.terminal_status == "SUCCEEDED"]\n        escalated = [item for item in artifacts if item.replay.terminal_status == "ESCALATED"]\n        lowest = (\n            min(item.replay.total_provider_cost_usd for item in successful)\n            if successful\n            else None\n        )\n        return FailureFingerprintHistory(\n            fingerprint_digest=fingerprint_digest,\n            seen_count=len(artifacts),\n            successful_count=len(successful),\n            escalated_count=len(escalated),\n            lowest_success_cost_usd=lowest,\n            latest_trace_id=artifacts[0].trace_id,\n        )\n'''
          new_summary = '''    def summarize_fingerprint(self, fingerprint_digest: str) -> FailureFingerprintHistory | None:\n        if not isinstance(fingerprint_digest, str) or not _DIGEST.fullmatch(fingerprint_digest):\n            raise SQLiteTraceStoreError("fingerprint digest is invalid")\n        try:\n            with self._connect() as connection:\n                rows = connection.execute(\n                    "SELECT trace_id, terminal_status, provider_cost_usd "\n                    "FROM repair_traces WHERE fingerprint_digest=? ORDER BY rowid DESC",\n                    (fingerprint_digest,),\n                ).fetchall()\n        except sqlite3.Error as exc:\n            raise SQLiteTraceStoreError("cannot summarize failure fingerprint history") from exc\n        if not rows:\n            return None\n        successful_costs: list[Decimal] = []\n        successful_count = 0\n        escalated_count = 0\n        for row in rows:\n            status = row["terminal_status"]\n            if status == "SUCCEEDED":\n                successful_count += 1\n                try:\n                    cost = Decimal(row["provider_cost_usd"])\n                except Exception as exc:\n                    raise SQLiteTraceStoreError("persisted provider cost is invalid") from exc\n                if not cost.is_finite() or cost < 0:\n                    raise SQLiteTraceStoreError("persisted provider cost is invalid")\n                successful_costs.append(cost)\n            elif status == "ESCALATED":\n                escalated_count += 1\n            else:\n                raise SQLiteTraceStoreError("persisted terminal status is invalid")\n        return FailureFingerprintHistory(\n            fingerprint_digest=fingerprint_digest,\n            seen_count=len(rows),\n            successful_count=successful_count,\n            escalated_count=escalated_count,\n            lowest_success_cost_usd=min(successful_costs) if successful_costs else None,\n            latest_trace_id=rows[0]["trace_id"],\n        )\n'''
          if old_summary not in value:
              raise SystemExit('summary marker not found')
          store.write_text(value.replace(old_summary, new_summary))

          init = Path('src/factory_runtime/__init__.py')
          api = init.read_text()
          block = '''from .trace_store_sqlite import (\n    FailureFingerprintHistory,\n    SQLiteBrokeredRepairTraceStore,\n    SQLiteTraceStoreError,\n)\n'''
          if 'from .trace_store_sqlite import (' not in api:
              api = api.replace('from .brokered_repair_trace import (', block + 'from .brokered_repair_trace import (')
          anchor = '    "BrokeredRepairTraceArtifact",\n'
          for name in reversed(['FailureFingerprintHistory', 'SQLiteBrokeredRepairTraceStore', 'SQLiteTraceStoreError']):
              if f'    "{name}",' not in api:
                  api = api.replace(anchor, f'    "{name}",\n' + anchor)
          init.write_text(api)
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v
      - name: Generate exact manifest and self-delete helper
        run: |
          rm .github/workflows/prepare-sqlite-trace-store.yml
          python scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh SQLite trace-store manifest [skip ci]"
          git push
