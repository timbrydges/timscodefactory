name: runtime-canary

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/factory_runtime/**"
      - "factory/canary/runtime-v1/**"
      - "scripts/runtime_canary.py"
      - "scripts/development_runner_replay.py"
      - "factory/projects/bonus-library-pagination/**"
      - "scripts/candidate_test_proof_canary.py"
      - "scripts/build_bounded_review_package.py"
      - "scripts/verify_bounded_review_package.py"
      - "scripts/stage_security_bundle.py"
      - "requirements-role-lambda.txt"
      - "requirements-aws-signing.txt"
      - ".github/workflows/runtime-canary.yml"

permissions:
  contents: read

jobs:
  development-replay:
    name: runtime / Bonus Library end-to-end replay
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Resolve Node for isolated offline tests
        run: |
          set -euo pipefail
          docker pull --quiet node:22-slim >/dev/null
          IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' node:22-slim)"
          echo "REPLAY_IMAGE=$IMAGE_REF" >> "$GITHUB_ENV"
      - name: Replay pinned real-repository candidate through connected runner
        run: python scripts/development_runner_replay.py --image-ref "$REPLAY_IMAGE" --output "$RUNNER_TEMP/bonus-replay"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bonus-library-offline-replay
          path: ${{ runner.temp }}/bonus-replay
          if-no-files-found: error
          retention-days: 7
  isolated-package:
    name: runtime / isolated Python 3.12 package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-aws-signing.txt
      - name: Build committed-source disabled runtime package
        # Build-time imports use the existing hash-locked CI environment. The
        # package verifier below still runs its probe with Python -I -S.
        run: python scripts/build_bounded_review_package.py "$RUNNER_TEMP/disabled-runtime.zip" --task bounded-review-005
      - name: Verify packaged dependencies and disabled entrypoints
        run: python scripts/verify_bounded_review_package.py "$RUNNER_TEMP/disabled-runtime.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: task005-disabled-runtime
          path: ${{ runner.temp }}/disabled-runtime.zip
          if-no-files-found: error
          retention-days: 7
  real-runtime-canary:
    name: runtime / real Docker canary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Resolve an immutable canary base image
        shell: bash
        run: |
          set -euo pipefail
          # This mutable tag is used only as a non-authoritative canary bootstrap.
          # The Factory runtime receives and executes only the resolved RepoDigest.
          docker pull --quiet python:3.12-slim >/dev/null
          IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          if [[ ! "$IMAGE_REF" =~ ^python@sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker did not resolve python:3.12-slim to an immutable RepoDigest" >&2
            exit 1
          fi
          echo "CANARY_IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
      - name: Run concrete Factory runtime canary
        run: >-
          python scripts/runtime_canary.py
          --workspace factory/canary/runtime-v1
          --image-ref "$CANARY_IMAGE_REF"
          --source-commit "$SOURCE_COMMIT"
      - name: Verify isolated candidate test evidence
        run: >-
          python scripts/candidate_test_proof_canary.py
          --image-ref "$CANARY_IMAGE_REF"
          --source-commit "$SOURCE_COMMIT"
          --output "$RUNNER_TEMP/candidate-test-proof.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isolated-candidate-test-proof
          path: ${{ runner.temp }}/candidate-test-proof.json
          if-no-files-found: error
          retention-days: 7
      - name: Verify task005 isolated candidate test evidence
        run: >-
          python scripts/candidate_test_proof_canary.py
          --task bounded-review-005
          --image-ref "$CANARY_IMAGE_REF"
          --source-commit "$SOURCE_COMMIT"
          --output "$RUNNER_TEMP/candidate-test-proof.json.005"
      - name: Stage task005 proof artifact
        run: |
          mkdir -p "$RUNNER_TEMP/remediation005-proof"
          cp "$RUNNER_TEMP/candidate-test-proof.json.005" "$RUNNER_TEMP/remediation005-proof/candidate-test-proof.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: isolated-remediation005-test-proof
          path: ${{ runner.temp }}/remediation005-proof/candidate-test-proof.json
          if-no-files-found: error
          retention-days: 7
