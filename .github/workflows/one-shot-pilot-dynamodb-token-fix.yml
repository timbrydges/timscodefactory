name: one-shot-pilot-dynamodb-token-fix
on:
  push:
    branches: [fix/pilot-dynamodb-token]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor == 'timbrydges'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pilot-dynamodb-token
          fetch-depth: 0
      - name: Patch bounded DynamoDB transaction token and diagnostics
        run: |
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('config/github/pilot-repo/pilot_runtime.py')
          text = runtime.read_text(encoding='utf-8')

          old = '''    except (OSError, subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:\n        raise PilotRuntimeError(f"AWS operation failed: {' '.join(args[:3])}") from exc\n'''
          new = '''    except subprocess.CalledProcessError as exc:\n        detail = (exc.stderr or "").strip().replace("\\n", " ")[:500]\n        suffix = f": {detail}" if detail else ""\n        raise PilotRuntimeError(f"AWS operation failed: {' '.join(args[:3])}{suffix}") from exc\n    except (OSError, subprocess.TimeoutExpired) as exc:\n        raise PilotRuntimeError(f"AWS operation failed: {' '.join(args[:3])}") from exc\n'''
          if old not in text:
              raise SystemExit('AWS diagnostic block not found')
          text = text.replace(old, new, 1)

          old_token = 'f"pilot-{hashlib.sha256((pk + event_sk).encode()).hexdigest()[:32]}"'
          new_token = 'f"pilot-{hashlib.sha256((pk + event_sk).encode()).hexdigest()[:30]}"'
          if old_token not in text:
              raise SystemExit('DynamoDB token expression not found')
          text = text.replace(old_token, new_token, 1)
          runtime.write_text(text, encoding='utf-8')

          tests = Path('tests/test_pilot_live_runtime.py')
          t = tests.read_text(encoding='utf-8')
          marker = '''def test_builder_output_rejects_unauthorized_or_duplicate_paths():\n'''
          addition = '''def test_dynamodb_transaction_token_respects_aws_36_char_limit_and_surfaces_stderr():\n    source = RUNTIME_PATH.read_text(encoding="utf-8")\n    assert 'hexdigest()[:30]' in source\n    assert 'hexdigest()[:32]' not in source\n    assert 'detail = (exc.stderr or "").strip()' in source\n\n\n'''
          if marker not in t:
              raise SystemExit('test insertion marker not found')
          if 'test_dynamodb_transaction_token_respects_aws_36_char_limit_and_surfaces_stderr' not in t:
              t = t.replace(marker, addition + marker, 1)
          tests.write_text(t, encoding='utf-8')
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/one-shot-pilot-dynamodb-token-fix.yml
      - name: Commit repair
        run: |
          git config user.name timbrydges
          git config user.email 214414801+timbrydges@users.noreply.github.com
          git add config/github/pilot-repo/pilot_runtime.py tests/test_pilot_live_runtime.py .github/workflows/one-shot-pilot-dynamodb-token-fix.yml
          git commit -m "fix(pilot): bound DynamoDB idempotency token"
          git push origin HEAD:fix/pilot-dynamodb-token
