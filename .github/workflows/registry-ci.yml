name: registry

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: registry / validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-role-lambda.txt -r requirements-aws-signing.txt
      - run: python -c "import boto3; from botocore.session import get_session; assert 'ED25519_SHA_512' in get_session().get_service_model('kms').shape_for('SigningAlgorithmSpec').enum"
      - run: python scripts/build_manifest.py --check
      - run: python scripts/validate_registry.py
      - run: python scripts/validate_workflows.py
      - run: python scripts/pilot_gate.py --mode validate
      - run: python scripts/pilot_gate.py --mode simulate
      - run: python -m unittest discover -s tests -v
      - name: Verify isolated handoff Lambda package on Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_handoff001_package.py "$RUNNER_TEMP/handoff001.zip"
          python scripts/verify_handoff001_package.py "$RUNNER_TEMP/handoff001.zip"
      - name: Verify isolated handoff 002 Lambda package on Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_handoff002_package.py "$RUNNER_TEMP/handoff002.zip"
          python scripts/verify_handoff002_package.py "$RUNNER_TEMP/handoff002.zip"
