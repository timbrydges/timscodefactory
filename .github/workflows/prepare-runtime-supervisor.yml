name: prepare-runtime-supervisor

on:
  push:
    branches:
      - feat/runtime-supervisor-reaper

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'timbrydges/timscodefactory' && github.actor == 'timbrydges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/runtime-supervisor-reaper
          fetch-depth: 1
      - name: Bind Docker sandbox provenance labels
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/factory_runtime/docker_sandbox.py')
          text = path.read_text(encoding='utf-8')
          old = '''            "--label",\n            "factory.sandbox=true",\n            "--label",\n            f"factory.request_id={request.request_id}",\n            self.policy.image_ref,\n'''
          new = '''            "--label",\n            "factory.sandbox=true",\n            "--label",\n            f"factory.runtime_session_id={request.request_id}",\n            "--label",\n            f"factory.request_id={request.request_id}",\n            "--label",\n            f"factory.task_id={request.task_id}",\n            "--label",\n            f"factory.lease_id={request.lease_id}",\n            "--label",\n            f"factory.role_id={request.role_id}",\n            "--label",\n            f"factory.source_commit={request.source_commit}",\n            "--label",\n            f"factory.runner_identity={self.policy.runner_identity}",\n            self.policy.image_ref,\n'''
          if text.count(old) != 1:
              raise SystemExit('Docker provenance label patch target missing')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          test = Path('tests/test_docker_sandbox.py')
          text = test.read_text(encoding='utf-8')
          marker = '''            self.assertNotIn("--privileged", create_argv)\n            self.assertFalse(any("docker.sock" in arg for arg in create_argv))\n'''
          addition = '''            self.assertNotIn("--privileged", create_argv)\n            self.assertFalse(any("docker.sock" in arg for arg in create_argv))\n            for expected_label in (\n                "factory.sandbox=true",\n                f"factory.runtime_session_id={req.request_id}",\n                f"factory.request_id={req.request_id}",\n                f"factory.task_id={req.task_id}",\n                f"factory.lease_id={req.lease_id}",\n                f"factory.role_id={req.role_id}",\n                f"factory.source_commit={req.source_commit}",\n                f"factory.runner_identity={policy.runner_identity}",\n            ):\n                self.assertIn(expected_label, create_argv)\n'''
          if text.count(marker) != 1:
              raise SystemExit('Docker sandbox test patch target missing')
          test.write_text(text.replace(marker, addition, 1), encoding='utf-8')
      - name: Export runtime supervisor API
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/factory_runtime/__init__.py')
          text = path.read_text(encoding='utf-8')
          import_block = '''from .runtime_supervisor import (\n    DockerRuntimeResourceHandle,\n    DockerRuntimeSupervisor,\n    DockerRuntimeSupervisorPolicy,\n    RuntimeResourceBindingError,\n    RuntimeSupervisorError,\n    RuntimeTerminationError,\n    RuntimeTerminationReceipt,\n)\n'''
          marker = 'from .sandbox import (\n'
          if import_block not in text:
              if text.count(marker) != 1:
                  raise SystemExit('sandbox import marker missing')
              text = text.replace(marker, import_block + marker, 1)

          names = [
              'DockerRuntimeResourceHandle',
              'DockerRuntimeSupervisor',
              'DockerRuntimeSupervisorPolicy',
              'RuntimeResourceBindingError',
              'RuntimeSupervisorError',
              'RuntimeTerminationError',
              'RuntimeTerminationReceipt',
          ]
          all_marker = '    "RuntimeResult",\n'
          if any(f'    "{name}",\n' not in text for name in names):
              if text.count(all_marker) != 1:
                  raise SystemExit('__all__ runtime result marker missing')
              exports = ''.join(f'    "{name}",\n' for name in names)
              text = text.replace(all_marker, all_marker + exports, 1)
          path.write_text(text, encoding='utf-8')
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
          cache: pip
      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v
      - name: Generate exact manifest and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-runtime-supervisor.yml
          python scripts/build_manifest.py
          python scripts/build_manifest.py --check
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh runtime-supervisor manifest [skip ci]"
          git push origin HEAD:feat/runtime-supervisor-reaper
