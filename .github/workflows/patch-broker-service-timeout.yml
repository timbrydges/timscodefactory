name: patch-broker-service-timeout

on:
  push:
    branches:
      - feat/provider-broker-service-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'timbrydges/timscodefactory' && github.actor == 'timbrydges'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-broker-service-contract
          fetch-depth: 1
      - name: Patch provider timeout and auth typing
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/factory_runtime/provider_broker_service.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("import hashlib\n", "import asyncio\nimport hashlib\n"),
              (
                  "    max_cost_usd_per_request: Decimal = Decimal(\"1.00\")\n    max_auth_ttl_seconds: int = 900\n",
                  "    max_cost_usd_per_request: Decimal = Decimal(\"1.00\")\n    max_auth_ttl_seconds: int = 900\n    provider_timeout_seconds: int = 90\n",
              ),
              (
                  "            (\"max_auth_ttl_seconds\", self.max_auth_ttl_seconds, 30, 3600),\n",
                  "            (\"max_auth_ttl_seconds\", self.max_auth_ttl_seconds, 30, 3600),\n            (\"provider_timeout_seconds\", self.provider_timeout_seconds, 1, 300),\n",
              ),
              (
                  "        if auth.audience != _EXPECTED_AUDIENCE:\n            raise ProviderBrokerAuthenticationError(\"broker caller audience is invalid\")\n        if (\n            auth.issued_at.tzinfo is None\n",
                  "        if auth.audience != _EXPECTED_AUDIENCE:\n            raise ProviderBrokerAuthenticationError(\"broker caller audience is invalid\")\n        if not isinstance(auth.issued_at, datetime) or not isinstance(auth.expires_at, datetime):\n            raise ProviderBrokerAuthenticationError(\"broker auth timestamps must be datetimes\")\n        if (\n            auth.issued_at.tzinfo is None\n",
              ),
              (
                  "        result = await self.provider_invoker.invoke(\n            target=target,\n            turn=payload[\"turn\"],\n            max_cost_usd=granted_cost,\n            decision_schema_version=payload[\"decision_schema_version\"],\n        )\n",
                  "        try:\n            result = await asyncio.wait_for(\n                self.provider_invoker.invoke(\n                    target=target,\n                    turn=payload[\"turn\"],\n                    max_cost_usd=granted_cost,\n                    decision_schema_version=payload[\"decision_schema_version\"],\n                ),\n                timeout=self.policy.provider_timeout_seconds,\n            )\n        except asyncio.TimeoutError as exc:\n            raise ProviderBrokerInvocationError(\"provider invocation exceeded broker timeout\") from exc\n",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"patch target count {count} for {old[:50]!r}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Self-delete and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-broker-service-timeout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(broker): enforce provider invocation timeout [skip ci]"
          git push origin HEAD:feat/provider-broker-service-contract
