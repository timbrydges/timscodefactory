name: manifest-refresh-pilot-bootstrap

on:
  push:
    branches: [feat/pilot-github-bootstrap]
    paths:
      - ".github/workflows/manifest-refresh-pilot-bootstrap.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/pilot-github-bootstrap
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Refresh integrity manifest and self-remove
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/manifest-refresh-pilot-bootstrap.yml
          python scripts/build_manifest.py
          git config user.name "tims-software-factory"
          git config user.email "actions@users.noreply.github.com"
          git add MANIFEST.sha256 .github/workflows/manifest-refresh-pilot-bootstrap.yml
          git diff --cached --check
          git commit -m "chore: bind pilot GitHub bootstrap integrity"
          git push origin HEAD:feat/pilot-github-bootstrap
