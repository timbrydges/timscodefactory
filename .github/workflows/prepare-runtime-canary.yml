name: prepare-runtime-canary

on:
  push:
    branches: [feat/real-runtime-canary]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fix live Docker runtime compatibility and lifecycle
        run: |
          python - <<'PY'
          from pathlib import Path

          sandbox = Path("src/factory_runtime/docker_sandbox.py")
          text = sandbox.read_text(encoding="utf-8")
          old_security = "--security-opt=no-new-privileges:true"
          new_security = "--security-opt=no-new-privileges=true"
          old_mount = 'mount = f"type=bind,src={copied_workspace},dst=/workspace,rw"'
          new_mount = 'mount = f"type=bind,src={copied_workspace},dst=/workspace"'
          if old_security not in text:
              raise SystemExit("expected Docker security option not found")
          if old_mount not in text:
              raise SystemExit("expected Docker bind mount not found")
          text = text.replace(old_security, new_security).replace(old_mount, new_mount)

          digest_anchor = '            "workspace=disposable-rw-copy",\n'
          digest_env = (
              digest_anchor
              + '            "HOME=/tmp",\n'
              + '            "CI=true",\n'
              + '            "PYTHONDONTWRITEBYTECODE=1",\n'
              + '            "GIT_CONFIG_COUNT=1",\n'
              + '            "GIT_CONFIG_KEY_0=safe.directory",\n'
              + '            "GIT_CONFIG_VALUE_0=/workspace",\n'
          )
          if digest_anchor not in text:
              raise SystemExit("sandbox environment digest anchor not found")
          text = text.replace(digest_anchor, digest_env)

          env_anchor = '            "--env",\n            "CI=true",\n'
          env_patch = env_anchor + '            "--env",\n            "PYTHONDONTWRITEBYTECODE=1",\n'
          if env_anchor not in text:
              raise SystemExit("sandbox CI environment anchor not found")
          text = text.replace(env_anchor, env_patch)
          sandbox.write_text(text, encoding="utf-8")

          pipeline = Path("src/factory_runtime/pipeline.py")
          value = pipeline.read_text(encoding="utf-8")
          if "import os\n" not in value:
              value = value.replace("import re\n", "import os\nimport re\n", 1)

          old_user = '    user: str = "65532:65532"\n'
          new_user = '    user: str | None = None\n'
          if old_user not in value:
              raise SystemExit("verification factory default user not found")
          value = value.replace(old_user, new_user, 1)

          class_marker = "class DockerVerificationFactory:\n"
          if class_marker not in value:
              raise SystemExit("DockerVerificationFactory class not found")
          prefix, docker_tail = value.split(class_marker, 1)
          create_anchor = '''    def create(\n        self,\n        *,\n        workspace: Path,\n        image_ref: str,\n        expected_runner_identity: str,\n    ) -> VerificationBinding:\n'''
          resolver = '''    def _resolved_user(self) -> str:\n        if self.user is not None:\n            return self.user\n        uid = os.geteuid()\n        gid = os.getegid()\n        if uid == 0:\n            raise RuntimePipelineError(\n                "automatic Docker verification user resolution refuses a root host process"\n            )\n        return f"{uid}:{gid}"\n\n'''
          if create_anchor not in docker_tail:
              raise SystemExit("DockerVerificationFactory create method not found")
          docker_tail = docker_tail.replace(create_anchor, resolver + create_anchor, 1)
          if "            user=self.user,\n" not in docker_tail:
              raise SystemExit("verification factory policy user binding not found")
          docker_tail = docker_tail.replace(
              "            user=self.user,\n",
              "            user=self._resolved_user(),\n",
              1,
          )
          value = prefix + class_marker + docker_tail
          pipeline.write_text(value, encoding="utf-8")

          test = Path("tests/test_docker_sandbox.py")
          tests = test.read_text(encoding="utf-8")
          if old_security not in tests:
              raise SystemExit("expected Docker security option assertion not found")
          tests = tests.replace(old_security, new_security)
          security_anchor = '            self.assertIn("--security-opt=no-new-privileges=true", create_argv)\n'
          assertions = (
              security_anchor
              + '            mount_index = create_argv.index("--mount")\n'
              + '            self.assertIn("type=bind,src=", create_argv[mount_index + 1])\n'
              + '            self.assertIn(",dst=/workspace", create_argv[mount_index + 1])\n'
              + '            self.assertNotIn(",rw", create_argv[mount_index + 1])\n'
              + '            self.assertIn("PYTHONDONTWRITEBYTECODE=1", create_argv)\n'
          )
          if security_anchor not in tests:
              raise SystemExit("Docker security assertion anchor not found")
          tests = tests.replace(security_anchor, assertions)
          test.write_text(tests, encoding="utf-8")

          concrete = Path("tests/test_runtime_pipeline_concrete.py")
          c = concrete.read_text(encoding="utf-8")
          c = c.replace("import unittest\n", "import unittest\nfrom unittest.mock import patch\n", 1)
          class_anchor = "class ConcreteRuntimePipelineTests(unittest.TestCase):\n"
          new_tests = '''class ConcreteRuntimePipelineTests(unittest.TestCase):\n    def test_default_verification_user_tracks_non_root_host_identity(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            factory = DockerVerificationFactory()\n            with patch("factory_runtime.pipeline.os.geteuid", return_value=1234), patch(\n                "factory_runtime.pipeline.os.getegid", return_value=5678\n            ):\n                binding = factory.create(\n                    workspace=Path(tmp),\n                    image_ref="python@sha256:" + "a" * 64,\n                    expected_runner_identity="factory_docker_sandbox_v1",\n                )\n            self.assertEqual(binding.adapter.policy.user, "1234:5678")\n\n    def test_default_verification_user_refuses_root_host_process(self):\n        with tempfile.TemporaryDirectory() as tmp:\n            factory = DockerVerificationFactory()\n            with patch("factory_runtime.pipeline.os.geteuid", return_value=0), patch(\n                "factory_runtime.pipeline.os.getegid", return_value=0\n            ):\n                with self.assertRaisesRegex(RuntimeError, "refuses a root host process"):\n                    factory.create(\n                        workspace=Path(tmp),\n                        image_ref="python@sha256:" + "a" * 64,\n                        expected_runner_identity="factory_docker_sandbox_v1",\n                    )\n\n'''
          if class_anchor not in c:
              raise SystemExit("concrete runtime test class anchor not found")
          c = c.replace(class_anchor, new_tests, 1)
          concrete.write_text(c, encoding="utf-8")
          PY

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip

      - run: python -m pip install --require-hashes -r requirements-ci.txt

      - name: Validate workflow supply-chain policy
        run: python scripts/validate_workflows.py

      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v

      - name: Resolve immutable canary image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet python:3.12-slim >/dev/null
          IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          if [[ ! "$IMAGE_REF" =~ ^python@sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker did not resolve an immutable Python image" >&2
            exit 1
          fi
          echo "CANARY_IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"

      - name: Probe exact hardened Docker create compatibility
        shell: bash
        run: |
          set -euo pipefail
          PROBE_DIR="$(mktemp -d)"
          PROBE_NAME="factory-canary-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          HOST_USER="$(id -u):$(id -g)"
          cleanup() {
            docker rm -f "$PROBE_NAME" >/dev/null 2>&1 || true
            rm -rf "$PROBE_DIR"
          }
          trap cleanup EXIT
          cp -a factory/canary/runtime-v1/. "$PROBE_DIR/"
          chmod -R a+rwX "$PROBE_DIR"
          docker create \
            --pull=never \
            --name "$PROBE_NAME" \
            --network=none \
            --read-only \
            --cap-drop=ALL \
            --security-opt=no-new-privileges=true \
            --memory 2g \
            --memory-swap 2g \
            --cpus 2 \
            --pids-limit 256 \
            --ulimit nofile=4096:4096 \
            --ulimit nproc=512:512 \
            --user "$HOST_USER" \
            --tmpfs=/tmp:rw,nosuid,nodev,size=256m \
            --mount "type=bind,src=$PROBE_DIR,dst=/workspace" \
            --workdir /workspace \
            --env HOME=/tmp \
            --env CI=true \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env GIT_CONFIG_COUNT=1 \
            --env GIT_CONFIG_KEY_0=safe.directory \
            --env GIT_CONFIG_VALUE_0=/workspace \
            --label factory.sandbox=true \
            --label factory.runtime_session_id=runtime-canary-v1.verify \
            --label factory.request_id=runtime-canary-v1.verify \
            --label factory.task_id=runtime-canary-task \
            --label factory.lease_id=runtime-canary-lease \
            --label factory.role_id=engineering_agent \
            --label "factory.source_commit=$GITHUB_SHA" \
            --label factory.runner_identity=factory_docker_sandbox_v1 \
            "$CANARY_IMAGE_REF" \
            python -m unittest discover -s tests -v >/dev/null

      - name: Run real Detector-Provisioner-Sandbox canary
        run: >-
          python scripts/runtime_canary.py
          --workspace factory/canary/runtime-v1
          --image-ref "$CANARY_IMAGE_REF"
          --source-commit "$GITHUB_SHA"

      - name: Generate exact manifest and self-delete helper
        run: |
          rm .github/workflows/prepare-runtime-canary.yml
          python scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh runtime-canary manifest [skip ci]"
          git push
