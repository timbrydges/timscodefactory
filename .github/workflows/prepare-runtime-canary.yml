name: prepare-runtime-canary

on:
  push:
    branches: [feat/real-runtime-canary]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fix live Docker no-new-privileges syntax
        run: |
          python - <<'PY'
          from pathlib import Path
          runtime = Path("src/factory_runtime/docker_sandbox.py")
          text = runtime.read_text(encoding="utf-8")
          old = "--security-opt=no-new-privileges:true"
          new = "--security-opt=no-new-privileges=true"
          if old not in text:
              raise SystemExit("expected Docker security option not found")
          runtime.write_text(text.replace(old, new), encoding="utf-8")

          test = Path("tests/test_docker_sandbox.py")
          value = test.read_text(encoding="utf-8")
          if old not in value:
              raise SystemExit("expected Docker security option assertion not found")
          test.write_text(value.replace(old, new), encoding="utf-8")
          PY
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Validate workflow supply-chain policy
        run: python scripts/validate_workflows.py
      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v
      - name: Resolve immutable canary image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet python:3.12-slim >/dev/null
          IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          if [[ ! "$IMAGE_REF" =~ ^python@sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker did not resolve an immutable Python image" >&2
            exit 1
          fi
          echo "CANARY_IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
      - name: Probe exact hardened Docker create compatibility
        shell: bash
        run: |
          set -euo pipefail
          PROBE_DIR="$(mktemp -d)"
          PROBE_NAME="factory-canary-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cleanup() {
            docker rm -f "$PROBE_NAME" >/dev/null 2>&1 || true
            rm -rf "$PROBE_DIR"
          }
          trap cleanup EXIT
          cp -a factory/canary/runtime-v1/. "$PROBE_DIR/"
          chmod -R a+rwX "$PROBE_DIR"
          set +e
          OUTPUT="$({
            docker create \
              --pull=never \
              --name "$PROBE_NAME" \
              --network=none \
              --read-only \
              --cap-drop=ALL \
              --security-opt=no-new-privileges=true \
              --memory 2g \
              --memory-swap 2g \
              --cpus 2 \
              --pids-limit 256 \
              --ulimit nofile=4096:4096 \
              --ulimit nproc=512:512 \
              --user 65532:65532 \
              --tmpfs=/tmp:rw,nosuid,nodev,size=256m \
              --mount "type=bind,src=$PROBE_DIR,dst=/workspace,rw" \
              --workdir /workspace \
              --env HOME=/tmp \
              --env CI=true \
              --env GIT_CONFIG_COUNT=1 \
              --env GIT_CONFIG_KEY_0=safe.directory \
              --env GIT_CONFIG_VALUE_0=/workspace \
              --label factory.sandbox=true \
              --label factory.runtime_session_id=runtime-canary-v1.verify \
              --label factory.request_id=runtime-canary-v1.verify \
              --label factory.task_id=runtime-canary-task \
              --label factory.lease_id=runtime-canary-lease \
              --label factory.role_id=engineering_agent \
              --label "factory.source_commit=$GITHUB_SHA" \
              --label factory.runner_identity=factory_docker_sandbox_v1 \
              "$CANARY_IMAGE_REF" \
              python -m unittest discover -s tests -v
          } 2>&1)"
          RC=$?
          set -e
          if [ "$RC" -ne 0 ]; then
            echo "Exact hardened docker create failed (exit $RC):" >&2
            printf '%s\n' "$OUTPUT" >&2
            exit "$RC"
          fi
          printf '%s\n' "$OUTPUT" >/dev/null
      - name: Run real Detector-Provisioner-Sandbox canary
        run: >-
          python scripts/runtime_canary.py
          --workspace factory/canary/runtime-v1
          --image-ref "$CANARY_IMAGE_REF"
          --source-commit "$GITHUB_SHA"
      - name: Generate exact manifest and self-delete helper
        run: |
          rm .github/workflows/prepare-runtime-canary.yml
          python scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh runtime-canary manifest [skip ci]"
          git push
