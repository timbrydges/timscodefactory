name: prepare-brokered-repair-canary

on:
  push:
    branches: [feat/real-brokered-repair-canary]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Validate workflow supply-chain policy
        run: python scripts/validate_workflows.py
      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v
      - name: Resolve immutable canary image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet python:3.12-slim >/dev/null
          IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          if [[ ! "$IMAGE_REF" =~ ^python@sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker did not resolve an immutable Python image" >&2
            exit 1
          fi
          echo "CANARY_IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
      - name: Run real brokered repair canary before PR
        run: >-
          python scripts/brokered_repair_canary.py
          --workspace factory/canary/brokered-repair-v1
          --image-ref "$CANARY_IMAGE_REF"
          --source-commit "$GITHUB_SHA"
      - name: Generate exact manifest and self-delete helper
        run: |
          rm .github/workflows/prepare-brokered-repair-canary.yml
          python scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh brokered-repair canary manifest [skip ci]"
          git push
