name: factory-owner-signing
run-name: Paid controller handoff004 owner allowance
on:
  workflow_dispatch:
    inputs:
      handoff004_plan_digest:
        description: Exact reviewed public plan digest
        required: true
        type: string
      handoff004_plan_base64:
        description: Exact bounded public plan
        required: true
        type: string
permissions:
  contents: read
  id-token: write
concurrency:
  group: factory-owner-signing
  cancel-in-progress: false
jobs:
  sign_handoff004_allowance:
    if: >-
      inputs.handoff004_plan_digest != '' && inputs.handoff004_plan_base64 != '' &&
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
      HANDOFF004_PLAN_DIGEST: ${{ inputs.handoff004_plan_digest }}
      HANDOFF004_PLAN_BASE64: ${{ inputs.handoff004_plan_base64 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --require-hashes -r requirements-ci.txt -r requirements-role-lambda.txt -r requirements-aws-signing.txt
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-owner
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          retry-max-attempts: 1
          role-duration-seconds: 900
          role-session-name: handoff004-owner-${{ github.run_id }}
      - name: Sign the exact fresh handoff allowance once
        run: python scripts/sign_handoff004_allowance.py "$RUNNER_TEMP/handoff004-activation.json" --approved-plan-digest "$HANDOFF004_PLAN_DIGEST"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: handoff004-owner-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/handoff004-activation.json
          if-no-files-found: ignore
          retention-days: 1
