name: one-shot-bedrock-diagnostics
on:
  push:
    branches:
      - fix/pilot-bedrock-diagnostics
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/pilot-bedrock-diagnostics
      - name: Patch Bedrock diagnostics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('config/github/pilot-repo/pilot_runtime.py')
          s = p.read_text(encoding='utf-8')
          old = '''        except (OSError, subprocess.CalledProcessError, subprocess.TimeoutExpired) as exc:\n            raise PilotRuntimeError("Bedrock Inspector invocation failed") from exc\n'''
          new = '''        except subprocess.CalledProcessError as exc:\n            detail = (exc.stderr or "").strip().replace("\\n", " ")[:500]\n            suffix = f": {detail}" if detail else ""\n            raise PilotRuntimeError(f"Bedrock Inspector invocation failed{suffix}") from exc\n        except (OSError, subprocess.TimeoutExpired) as exc:\n            raise PilotRuntimeError("Bedrock Inspector invocation failed") from exc\n'''
          if old not in s:
              raise SystemExit('expected Bedrock exception block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile config/github/pilot-repo/pilot_runtime.py
          git diff --check
      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "timbrydges"
          git config user.email "214414801+timbrydges@users.noreply.github.com"
          git rm .github/workflows/one-shot-bedrock-diagnostics.yml
          git add config/github/pilot-repo/pilot_runtime.py
          git commit -m "fix(pilot): surface Bedrock Inspector diagnostics"
          git push origin HEAD:fix/pilot-bedrock-diagnostics
