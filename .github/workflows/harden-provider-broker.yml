name: harden-provider-broker

on:
  push:
    branches:
      - feat/provider-broker-repair-adapter

permissions:
  contents: write

jobs:
  harden:
    if: github.repository == 'timbrydges/timscodefactory' && github.actor == 'timbrydges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-broker-repair-adapter
          fetch-depth: 1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Apply exact binding hardening
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/factory_runtime/provider_broker.py")
          text = path.read_text(encoding="utf-8")
          replacements = [
              ("import json\nimport math\n", "import json\n"),
              (
                  '_EXPECTED_ROLE = "engineering_agent"\n_EXPECTED_SECRET_POLICY = "brokered_ephemeral_only"\n',
                  '_EXPECTED_ROLE = "engineering_agent"\n_EXPECTED_PROVIDER_PROFILE = "coding_primary"\n_EXPECTED_MODEL_SELECTOR = "FACTORY_CODING_MODEL"\n_EXPECTED_NETWORK_POLICY = "provider_restricted"\n_EXPECTED_SECRET_POLICY = "brokered_ephemeral_only"\n',
              ),
              (
                  '    if parsed.hostname != "provider-broker.internal":\n        raise ProviderBrokerConfigError("provider broker endpoint must use provider-broker.internal")\n    if parsed.port not in (None, 443):\n        raise ProviderBrokerConfigError("provider broker endpoint must use port 443")\n',
                  '    if parsed.hostname != "provider-broker.internal":\n        raise ProviderBrokerConfigError("provider broker endpoint must use provider-broker.internal")\n    try:\n        port = parsed.port\n    except ValueError as exc:\n        raise ProviderBrokerConfigError("provider broker endpoint port is invalid") from exc\n    if port not in (None, 443):\n        raise ProviderBrokerConfigError("provider broker endpoint must use port 443")\n',
              ),
              (
                  '    if not isinstance(network_policy, str) or not network_policy:\n        raise ProviderBrokerConfigError("engineering agent lacks a network policy")\n    if role.get("secret_policy") != _EXPECTED_SECRET_POLICY:\n',
                  '    if not isinstance(network_policy, str) or not network_policy:\n        raise ProviderBrokerConfigError("engineering agent lacks a network policy")\n    if provider_profile != _EXPECTED_PROVIDER_PROFILE:\n        raise ProviderBrokerConfigError("engineering agent repair provider profile drifted from coding_primary")\n    if network_policy != _EXPECTED_NETWORK_POLICY:\n        raise ProviderBrokerConfigError("engineering agent repair network policy drifted from provider_restricted")\n    if role.get("secret_policy") != _EXPECTED_SECRET_POLICY:\n',
              ),
              (
                  '    if not isinstance(model_selector, str) or not model_selector:\n        raise ProviderBrokerConfigError("model selector is invalid")\n    if profile.get("authority_effect") != "none":\n',
                  '    if not isinstance(model_selector, str) or not model_selector:\n        raise ProviderBrokerConfigError("model selector is invalid")\n    if model_selector != _EXPECTED_MODEL_SELECTOR:\n        raise ProviderBrokerConfigError("repair model selector drifted from FACTORY_CODING_MODEL")\n    if profile.get("authority_effect") != "none":\n',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one patch target, found {text.count(old)}")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Refresh manifest and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/harden-provider-broker.yml
          python3 scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: harden provider-broker binding [skip ci]"
          git push origin HEAD:feat/provider-broker-repair-adapter
