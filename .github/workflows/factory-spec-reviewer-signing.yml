name: factory-spec-reviewer-signing

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: factory-spec-reviewer-signing
  cancel-in-progress: false

jobs:
  custody:
    if: >-
      github.ref == 'refs/heads/main' && github.actor_id == '214414801' &&
      github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    env:
      AWS_MAX_ATTEMPTS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c
        with:
          role-to-assume: arn:aws:iam::666730517561:role/tims-factory-signing-spec-reviewer
          aws-region: ca-central-1
          allowed-account-ids: '666730517561'
          role-duration-seconds: 900
          role-session-name: spec-custody-${{ github.run_id }}
          disable-retry: true
      - name: Verify custody and cross-role denial without review authority
        shell: bash
        run: |
          set -euo pipefail
          python scripts/spec_signing_canary.py "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" "$GITHUB_SHA" > "$RUNNER_TEMP/spec-custody.json"
          cat "$RUNNER_TEMP/spec-custody.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-spec-custody-${{ github.run_id }}
          path: ${{ runner.temp }}/spec-custody.json
          if-no-files-found: error
          retention-days: 30
