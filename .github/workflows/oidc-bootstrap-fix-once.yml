name: oidc-bootstrap-fix-once

on:
  push:
    branches: [fix/aws-bootstrap-oidc-reapply]
    paths:
      - ".github/workflows/oidc-bootstrap-fix-once.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: fix/aws-bootstrap-oidc-reapply
      - name: Patch bootstrap OIDC ownership logic and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/aws-bootstrap-cloudshell.sh')
          text = path.read_text(encoding='utf-8')
          old = '''FACTORY_OIDC_PROVIDER_ARN=""
while IFS= read -r provider_arn; do
  [[ -z "${provider_arn}" ]] && continue
  provider_url="$(
    aws iam get-open-id-connect-provider \\
      --open-id-connect-provider-arn "${provider_arn}" \\
      --query Url --output text
  )"
  if [[ "${provider_url}" == "token.actions.githubusercontent.com" ]]; then
    FACTORY_OIDC_PROVIDER_ARN="${provider_arn}"
    break
  fi
done < <(
  aws iam list-open-id-connect-providers \\
    --query 'OpenIDConnectProviderList[].Arn' --output text | tr '\\t' '\\n'
)

FACTORY_TERRAFORM_VARS=(-var="aws_region=${FACTORY_REGION}")
if [[ -n "${FACTORY_OIDC_PROVIDER_ARN}" ]]; then
  echo "Reusing GitHub OIDC provider: ${FACTORY_OIDC_PROVIDER_ARN}"
  FACTORY_TERRAFORM_VARS+=(
    -var="existing_github_oidc_provider_arn=${FACTORY_OIDC_PROVIDER_ARN}"
  )
fi
'''
          new = '''FACTORY_OIDC_PROVIDER_ARN=""
FACTORY_OIDC_MANAGED_IN_STATE="false"
if terraform -chdir="${FACTORY_TERRAFORM_DIR}" state list 2>/dev/null \\
    | grep -qx 'aws_iam_openid_connect_provider.github\\[0\\]'; then
  FACTORY_OIDC_MANAGED_IN_STATE="true"
  echo "GitHub OIDC provider is already managed by Terraform state."
else
  while IFS= read -r provider_arn; do
    [[ -z "${provider_arn}" ]] && continue
    provider_url="$(
      aws iam get-open-id-connect-provider \\
        --open-id-connect-provider-arn "${provider_arn}" \\
        --query Url --output text
    )"
    if [[ "${provider_url}" == "token.actions.githubusercontent.com" ]]; then
      FACTORY_OIDC_PROVIDER_ARN="${provider_arn}"
      break
    fi
  done < <(
    aws iam list-open-id-connect-providers \\
      --query 'OpenIDConnectProviderList[].Arn' --output text | tr '\\t' '\\n'
  )
fi

FACTORY_TERRAFORM_VARS=(-var="aws_region=${FACTORY_REGION}")
if [[ "${FACTORY_OIDC_MANAGED_IN_STATE}" != "true" && -n "${FACTORY_OIDC_PROVIDER_ARN}" ]]; then
  echo "Reusing externally managed GitHub OIDC provider: ${FACTORY_OIDC_PROVIDER_ARN}"
  FACTORY_TERRAFORM_VARS+=(
    -var="existing_github_oidc_provider_arn=${FACTORY_OIDC_PROVIDER_ARN}"
  )
fi
'''
          if text.count(old) != 1:
              raise SystemExit('expected bootstrap OIDC block not found exactly once')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          rm .github/workflows/oidc-bootstrap-fix-once.yml
          python scripts/build_manifest.py
          git config user.name "tims-software-factory"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/aws-bootstrap-cloudshell.sh MANIFEST.sha256 .github/workflows/oidc-bootstrap-fix-once.yml
          git diff --cached --check
          git commit -m "fix(aws): preserve Terraform-managed GitHub OIDC provider"
          git push origin HEAD:fix/aws-bootstrap-oidc-reapply
