name: prepare-provider-qualification

on:
  push:
    branches:
      - feat/provider-qualification-gate

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'timbrydges/timscodefactory' && github.actor == 'timbrydges'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-qualification-gate
          fetch-depth: 1
      - name: Export qualification API
        shell: python
        run: |
          from pathlib import Path
          init = Path('src/factory_runtime/__init__.py')
          text = init.read_text(encoding='utf-8')
          marker = 'from .provider_targets import (\n'
          block = '''from .provider_qualification import (\n    ProviderQualificationDecision,\n    ProviderQualificationError,\n    ProviderQualificationMeasurement,\n    ProviderQualificationPolicy,\n    load_provider_qualification_policy,\n    qualify_provider,\n)\n'''
          if block not in text:
              if text.count(marker) != 1:
                  raise SystemExit('provider target import marker not unique')
              text = text.replace(marker, block + marker, 1)
          additions = [
              '    "ProviderQualificationDecision",\n',
              '    "ProviderQualificationError",\n',
              '    "ProviderQualificationMeasurement",\n',
              '    "ProviderQualificationPolicy",\n',
              '    "load_provider_qualification_policy",\n',
              '    "qualify_provider",\n',
          ]
          anchor = '    "ProviderSelectorValueSource",\n'
          if text.count(anchor) != 1:
              raise SystemExit('__all__ anchor not unique')
          missing = ''.join(item for item in additions if item not in text)
          if missing:
              text = text.replace(anchor, missing + anchor, 1)
          init.write_text(text, encoding='utf-8')
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - name: Install locked CI dependencies
        run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v
      - name: Generate exact manifest and self-delete helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/prepare-provider-qualification.yml
          python3 scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "chore: refresh provider-qualification manifest [skip ci]"
          git push origin HEAD:feat/provider-qualification-gate
