name: patch-broker-response-classification

on:
  push:
    branches:
      - feat/provider-broker-service-contract

permissions:
  contents: write

jobs:
  patch:
    if: github.repository == 'timbrydges/timscodefactory' && github.actor == 'timbrydges'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: feat/provider-broker-service-contract
          fetch-depth: 1
      - name: Patch response failure classification
        shell: python
        run: |
          from pathlib import Path
          service = Path("src/factory_runtime/provider_broker_service.py")
          text = service.read_text(encoding="utf-8")
          old = '        _validate_with_schema(self._response_validator, response_payload, context="broker response")\n'
          new = '''        try:\n            _validate_with_schema(\n                self._response_validator,\n                response_payload,\n                context="broker response",\n            )\n        except ProviderBrokerRequestError as exc:\n            raise ProviderBrokerInvocationError(\n                "provider returned a decision that violates the broker response contract"\n            ) from exc\n'''
          if text.count(old) != 1:
              raise SystemExit("service response validation patch target missing")
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          test = Path("tests/test_provider_broker_service.py")
          text = test.read_text(encoding="utf-8")
          old = '        with self.assertRaises(ProviderBrokerRequestError):\n            asyncio.run(model.decide(repair_turn()))\n\n    def test_unresolvable_selector_fails_before_provider_invocation(self):\n'
          new = '        with self.assertRaises(ProviderBrokerInvocationError):\n            asyncio.run(model.decide(repair_turn()))\n\n    def test_unresolvable_selector_fails_before_provider_invocation(self):\n'
          if text.count(old) != 1:
              raise SystemExit("test response classification patch target missing")
          test.write_text(text.replace(old, new, 1), encoding="utf-8")
      - name: Self-delete and commit
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/patch-broker-response-classification.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(broker): classify malformed provider decisions [skip ci]"
          git push origin HEAD:feat/provider-broker-service-contract
