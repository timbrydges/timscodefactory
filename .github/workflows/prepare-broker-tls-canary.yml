name: prepare-broker-tls-canary

on:
  push:
    branches: [feat/real-broker-tls-canary]

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - name: Validate workflow supply-chain policy
        run: python scripts/validate_workflows.py
      - name: Run full unit suite before PR
        run: python -m unittest discover -s tests -v
      - name: Resolve immutable canary image
        shell: bash
        run: |
          set -euo pipefail
          docker pull --quiet python:3.12-slim >/dev/null
          IMAGE_REF="$(docker image inspect --format '{{index .RepoDigests 0}}' python:3.12-slim)"
          if [[ ! "$IMAGE_REF" =~ ^python@sha256:[0-9a-f]{64}$ ]]; then
            echo "Docker did not resolve an immutable Python image" >&2
            exit 1
          fi
          echo "CANARY_IMAGE_REF=$IMAGE_REF" >> "$GITHUB_ENV"
      - name: Generate ephemeral broker TLS certificate
        shell: bash
        run: |
          set -euo pipefail
          TLS_DIR="$RUNNER_TEMP/factory-broker-tls"
          mkdir -p "$TLS_DIR"
          openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 \
            -keyout "$TLS_DIR/broker.key" \
            -out "$TLS_DIR/broker.crt" \
            -subj "/CN=provider-broker.internal" \
            -addext "subjectAltName=DNS:provider-broker.internal" \
            -addext "basicConstraints=critical,CA:TRUE" \
            -addext "keyUsage=critical,digitalSignature,keyEncipherment,keyCertSign" \
            -addext "extendedKeyUsage=serverAuth"
          chmod 600 "$TLS_DIR/broker.key"
          echo "BROKER_TLS_CERT=$TLS_DIR/broker.crt" >> "$GITHUB_ENV"
          echo "BROKER_TLS_KEY=$TLS_DIR/broker.key" >> "$GITHUB_ENV"
      - name: Run real TLS broker repair canary before PR
        run: >-
          python scripts/brokered_repair_tls_canary.py
          --workspace factory/canary/brokered-repair-v1
          --image-ref "$CANARY_IMAGE_REF"
          --source-commit "$GITHUB_SHA"
          --tls-cert "$BROKER_TLS_CERT"
          --tls-key "$BROKER_TLS_KEY"
          --tls-ca "$BROKER_TLS_CERT"
      - name: Generate exact manifest and self-delete helper
        run: |
          rm .github/workflows/prepare-broker-tls-canary.yml
          python scripts/build_manifest.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: refresh broker TLS canary manifest [skip ci]"
          git push
