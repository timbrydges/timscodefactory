name: build-attest

on:
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build:
    name: build / attest control plane
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.txt
      - run: |
          python scripts/build_manifest.py --check
          python scripts/validate_registry.py
          python scripts/validate_workflows.py
          python scripts/preflight.py --mode static
      - run: |
          tar --exclude=.git -C "$GITHUB_WORKSPACE" -czf "$RUNNER_TEMP/factory-control-plane.tar.gz" .
          sha256sum "$RUNNER_TEMP/factory-control-plane.tar.gz" > "$RUNNER_TEMP/factory-control-plane.tar.gz.sha256"
      - uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d
        with:
          subject-path: ${{ runner.temp }}/factory-control-plane.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: factory-control-plane-${{ github.sha }}
          path: |
            ${{ runner.temp }}/factory-control-plane.tar.gz
            ${{ runner.temp }}/factory-control-plane.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30
